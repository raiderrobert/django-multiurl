name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "4.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.10", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.14", django: "6.1" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --isolated --with "django==${{ matrix.django }}.*" --with pytest pytest -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Check wheel contents
        run: unzip -l dist/*.whl | grep -q ' multiurl.py$'
