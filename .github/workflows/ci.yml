name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled. Each push to master gets its own group
  # (keyed by SHA), so back-to-back merges never leave a cancelled run behind
  # (a cancelled run shows as "failing" on the badge).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python version each Django release supports, within our
        # floor (requires-python >= 3.10, django >= 4.2).
        include:
          - { django: "4.2", python: "3.10" }
          - { django: "4.2", python: "3.11" }
          - { django: "4.2", python: "3.12" }
          - { django: "5.2", python: "3.10" }
          - { django: "5.2", python: "3.11" }
          - { django: "5.2", python: "3.12" }
          - { django: "5.2", python: "3.13" }
          - { django: "5.2", python: "3.14" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.0", python: "3.13" }
          - { django: "6.0", python: "3.14" }
          - { django: "6.1", python: "3.12" }
          - { django: "6.1", python: "3.13" }
          - { django: "6.1", python: "3.14" }
          - { django: "6.1", python: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --isolated --with "django==${{ matrix.django }}.*" --with pytest pytest -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Check wheel contents
        run: unzip -l dist/*.whl | grep -q ' multiurl.py$'
